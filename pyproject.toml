[project]
name = "rvsec-study02-replication"
version = "1.0.0"
description = "Replication package: Android test-case generation with runtime verification for cryptographic API misuses (campaign estudo02-20260916)"
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
# The article's pins: the GLM values depend on these exact versions.
dependencies = [
    "pandas==2.3.3",
    "numpy==1.26.4",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
